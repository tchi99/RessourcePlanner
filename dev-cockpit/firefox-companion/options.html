<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dev Cockpit Companion</title>
    <style>
      :root { font-family: system-ui, sans-serif; color-scheme: dark; }
      body { margin: 0; background: #0d131c; color: #edf3ff; }
      main { width: min(680px, calc(100% - 32px)); margin: 48px auto; }
      .card { border: 1px solid #2a3547; border-radius: 14px; background: #131c28; padding: 22px; }
      h1 { margin-top: 0; font-size: 24px; }
      p { color: #9aabc2; line-height: 1.55; }
      label { display: grid; gap: 7px; margin-top: 20px; color: #b7c4d6; font-size: 13px; }
      input { border: 1px solid #34445b; border-radius: 9px; background: #0d141d; color: #edf3ff; padding: 10px 12px; font: inherit; }
      .actions { display: flex; gap: 8px; margin-top: 14px; }
      button { border: 1px solid #3a5577; border-radius: 9px; background: #1b2b40; color: #edf3ff; padding: 9px 13px; cursor: pointer; }
      #status { min-height: 22px; margin-top: 12px; font-size: 13px; color: #91c5ff; }
      .privacy { margin-top: 24px; border-top: 1px solid #273446; padding-top: 16px; font-size: 12px; }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <h1>Dev Cockpit Companion</h1>
        <p>
          Cette extension signale uniquement l'URL de la conversation, l'état
          working/idle, la visibilité de l'onglet et un signal UI fixe. Elle
          n'envoie pas le texte de la conversation.
        </p>
        <label>
          Adresse locale du Dev Cockpit
          <input id="cockpit-url" type="url" value="http://127.0.0.1:8081" />
        </label>
        <div class="actions">
          <button id="save" type="button">Enregistrer</button>
          <button id="test" type="button">Tester la connexion</button>
        </div>
        <div id="status" role="status"></div>
        <p class="privacy">
          Par sécurité, seules les adresses loopback <code>127.0.0.1</code>
          et <code>localhost</code> sont acceptées.
        </p>
      </div>
    </main>
    <script src="options.js"></script>
  </body>
</html>

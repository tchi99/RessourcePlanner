name: One-off demand requests page extraction

on:
  push:
    branches:
      - refactor/demand-requests-page
    paths:
      - .github/workflows/refactor-demand-requests-page.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/demand-requests-page

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract demand requests page
        run: python tools/refactor_extract_demand_requests_page.py

      - name: Compile changed Python sources
        run: python -m compileall app tests

      - name: Commit generated extraction
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app tests
          git commit -m "Refactor: extract demand requests page"
          git push origin HEAD:refactor/demand-requests-page

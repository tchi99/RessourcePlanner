name: One-off operational renderer registration

on:
  push:
    branches:
      - refactor/operational-renderer-registry
    paths:
      - .github/workflows/refactor-operational-renderer-registry.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/operational-renderer-registry
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply renderer registration refactor
        run: python tools/refactor_register_operational_renderer.py
      - name: Commit transformed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/v15_refinements.py app/v16_refinements.py app/v17_refinements.py app/v17_sort_fix.py
          git commit -m "Register operational renderers explicitly"
          git push

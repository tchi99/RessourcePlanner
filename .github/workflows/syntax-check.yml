name: CI

on:
  pull_request:
    paths:
      - "main.py"
      - "app/**"
      - "tests/**"
      - "tools/**"
      - "migrations/**"
      - "alembic.ini"
      - "requirements*.txt"
      - "constraints*.txt"
      - ".github/workflows/**"

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install validated dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q app tests tools migrations main.py
      - name: Run verification suite
        run: python -m unittest discover -s tests -v
      - name: Scan current repository tree for common PII and secrets
        run: python tools/privacy_scan.py

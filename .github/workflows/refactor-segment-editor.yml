name: One-off segment editor extraction

on:
  push:
    branches:
      - refactor/segment-editor-service
    paths:
      - .github/workflows/refactor-segment-editor.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/segment-editor-service
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply extraction
        run: python tools/refactor_extract_segment_editor.py
      - name: Commit transformed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/v13.py app/segments_page.py app/v15_refinements.py
          git commit -m "Wire explicit segment editor"
          git push

name: Windows desktop package

on:
  pull_request:
    paths:
      - "main.py"
      - "app/**"
      - "requirements.txt"
      - "constraints-release.txt"
      - ".github/workflows/windows-release.yml"
      - "tools/create_internal_code_signing_certificate.ps1"
      - "CODE_SIGNING.md"
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version à construire sans le préfixe v (ex. 1.8.0-signing-test)"
        required: true
        default: "1.8.0-signing-test"

jobs:
  build-ci:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install application and packaging dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints-release.txt "nicegui[native]==3.16.0" "pyinstaller==6.21.0"

      - name: Smoke-test NiceGUI source startup
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP "ressourceplanner-startup.out"
          $stderr = Join-Path $env:RUNNER_TEMP "ressourceplanner-startup.err"
          $process = Start-Process python -ArgumentList "main.py" -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Start-Sleep -Seconds 7
          if ($process.HasExited) {
            if (Test-Path $stdout) { Get-Content $stdout }
            if (Test-Path $stderr) { Get-Content $stderr }
            throw "RessourcePlanner exited during startup with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id -Force

      - name: Build unsigned CI executable
        shell: pwsh
        run: |
          $name = "RessourcePlanner-CI-Windows-x64"
          nicegui-pack --onefile --windowed --name $name main.py
          if (-not (Test-Path "dist/$name.exe")) {
            throw "Expected executable was not produced."
          }

      - name: Upload unsigned CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: RessourcePlanner-CI-Windows-x64
          path: dist/RessourcePlanner-CI-Windows-x64.exe
          if-no-files-found: error

  build-sign-release:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 35
    environment: release-signing
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            $tag = "${{ github.ref_name }}"
            if (-not $tag.StartsWith("v")) {
              throw "Release tags must start with v."
            }
            $version = $tag.Substring(1)
          }
          else {
            $version = "${{ inputs.version }}".Trim()
          }
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Version is required."
          }
          if ($version -notmatch '^[0-9A-Za-z][0-9A-Za-z._-]*$') {
            throw "Version contains unsupported characters: $version"
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "APP_NAME=RessourcePlanner-V$version-Windows-x64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate internal signing configuration
        shell: pwsh
        env:
          CODE_SIGNING_PFX_BASE64: ${{ secrets.CODE_SIGNING_PFX_BASE64 }}
          CODE_SIGNING_PFX_PASSWORD: ${{ secrets.CODE_SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CODE_SIGNING_PFX_BASE64)) {
            throw "Missing release-signing secret CODE_SIGNING_PFX_BASE64."
          }
          if ([string]::IsNullOrWhiteSpace($env:CODE_SIGNING_PFX_PASSWORD)) {
            throw "Missing release-signing secret CODE_SIGNING_PFX_PASSWORD."
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install application and packaging dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints-release.txt "nicegui[native]==3.16.0" "pyinstaller==6.21.0"

      - name: Smoke-test NiceGUI source startup
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP "ressourceplanner-startup.out"
          $stderr = Join-Path $env:RUNNER_TEMP "ressourceplanner-startup.err"
          $process = Start-Process python -ArgumentList "main.py" -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Start-Sleep -Seconds 7
          if ($process.HasExited) {
            if (Test-Path $stdout) { Get-Content $stdout }
            if (Test-Path $stderr) { Get-Content $stderr }
            throw "RessourcePlanner exited during startup with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id -Force

      - name: Build one-file Windows desktop application
        shell: pwsh
        run: |
          nicegui-pack --onefile --windowed --name $env:APP_NAME main.py
          $exe = "dist/$($env:APP_NAME).exe"
          if (-not (Test-Path $exe)) {
            throw "Expected executable was not produced: $exe"
          }

      - name: Restore signing certificate into ephemeral runner
        shell: pwsh
        env:
          CODE_SIGNING_PFX_BASE64: ${{ secrets.CODE_SIGNING_PFX_BASE64 }}
          CODE_SIGNING_PFX_PASSWORD: ${{ secrets.CODE_SIGNING_PFX_PASSWORD }}
        run: |
          $signingDir = Join-Path $env:RUNNER_TEMP "ressourceplanner-signing"
          New-Item -ItemType Directory -Force -Path $signingDir | Out-Null
          $pfxPath = Join-Path $signingDir "internal-code-signing.pfx"
          $cerPath = Join-Path $signingDir "RessourcePlanner-Internal-CodeSigning.cer"

          Write-Host "Decoding the protected PFX payload..."
          try {
            $bytes = [Convert]::FromBase64String($env:CODE_SIGNING_PFX_BASE64)
          }
          catch {
            throw "CODE_SIGNING_PFX_BASE64 is not valid Base64."
          }
          [IO.File]::WriteAllBytes($pfxPath, $bytes)
          Write-Host "PFX payload restored."

          Write-Host "Importing the signing certificate into the ephemeral CurrentUser/My store..."
          $securePassword = ConvertTo-SecureString $env:CODE_SIGNING_PFX_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation "Cert:\CurrentUser\My" -Password $securePassword
          if ($null -eq $cert) {
            throw "The internal signing PFX could not be imported."
          }
          Write-Host "PFX import completed."

          $codeSigningOid = "1.3.6.1.5.5.7.3.3"
          $hasCodeSigningEku = $false
          foreach ($extension in $cert.Extensions) {
            if ($extension.Oid.Value -eq "2.5.29.37" -and $extension.Format($false) -match $codeSigningOid) {
              $hasCodeSigningEku = $true
              break
            }
          }
          if (-not $hasCodeSigningEku) {
            throw "The certificate does not contain the Code Signing EKU."
          }

          Export-Certificate -Cert $cert -FilePath $cerPath -Force | Out-Null
          Write-Host "Public certificate exported."

          # Do not add the self-signed publisher certificate to the runner Root store.
          # Root-store insertion can prompt interactively on hosted runners. The verification
          # step below validates this exact self-signed signer through a custom in-memory chain.
          "SIGNING_CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SIGNING_PFX_PATH=$pfxPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SIGNING_CER_PATH=$cerPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Internal signing certificate loaded: $($cert.Subject)"
          Write-Host "Certificate expires: $($cert.NotAfter.ToUniversalTime().ToString('u'))"

      - name: Locate SignTool
        shell: pwsh
        run: |
          $fromPath = Get-Command signtool.exe -ErrorAction SilentlyContinue
          if ($fromPath) {
            $signtool = $fromPath.Source
          }
          else {
            $roots = @(
              "${env:ProgramFiles(x86)}\Windows Kits\10\bin",
              "${env:ProgramFiles}\Windows Kits\10\bin"
            ) | Where-Object { $_ -and (Test-Path $_) }
            $candidates = @()
            foreach ($root in $roots) {
              $candidates += Get-ChildItem -Path $root -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue |
                Where-Object { $_.Directory.Name -eq "x64" }
            }
            $signtool = $candidates | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          }
          if ([string]::IsNullOrWhiteSpace($signtool)) {
            throw "SignTool.exe was not found on the Windows runner."
          }
          "SIGNTOOL_PATH=$signtool" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using SignTool: $signtool"

      - name: Sign executable with internal Authenticode certificate
        shell: pwsh
        run: |
          $exe = "dist/$($env:APP_NAME).exe"
          & $env:SIGNTOOL_PATH sign `
            /sha1 $env:SIGNING_CERT_THUMBPRINT `
            /fd SHA256 `
            /tr http://timestamp.digicert.com `
            /td SHA256 `
            /d "RessourcePlanner" `
            $exe
          if ($LASTEXITCODE -ne 0) {
            throw "SignTool failed with exit code $LASTEXITCODE."
          }

      - name: Verify Authenticode signature
        shell: pwsh
        run: |
          $exe = "dist/$($env:APP_NAME).exe"
          $signature = Get-AuthenticodeSignature $exe
          $signature | Format-List Status,StatusMessage,SignerCertificate,TimeStamperCertificate

          if ($null -eq $signature.SignerCertificate) {
            throw "No signer certificate was found after signing."
          }
          if ($signature.SignerCertificate.Thumbprint -ne $env:SIGNING_CERT_THUMBPRINT) {
            throw "The executable was signed by an unexpected certificate."
          }
          if ($null -eq $signature.TimeStamperCertificate) {
            throw "The executable does not contain the expected RFC3161 timestamp."
          }

          # Hosted runners do not trust our private self-signed publisher by design.
          # Get-AuthenticodeSignature therefore reports UnknownError solely because the
          # chain ends at an untrusted self-signed root. Accept only that precise case.
          $expectedPrivateRoot = $false
          if ($signature.Status -eq [System.Management.Automation.SignatureStatus]::Valid) {
            Write-Host "Authenticode signature is trusted by the runner."
          }
          elseif (
            $signature.Status -eq [System.Management.Automation.SignatureStatus]::UnknownError -and
            $signature.StatusMessage -match '(?i)root certificate.*not trusted'
          ) {
            $expectedPrivateRoot = $true
            Write-Host "Expected self-signed trust result detected; validating a custom chain for the exact signer..."

            $chain = [System.Security.Cryptography.X509Certificates.X509Chain]::new()
            try {
              $chain.ChainPolicy.TrustMode = [System.Security.Cryptography.X509Certificates.X509ChainTrustMode]::CustomRootTrust
              $chain.ChainPolicy.CustomTrustStore.Add($signature.SignerCertificate)
              $chain.ChainPolicy.RevocationMode = [System.Security.Cryptography.X509Certificates.X509RevocationMode]::NoCheck
              if (-not $chain.Build($signature.SignerCertificate)) {
                $chainStatus = ($chain.ChainStatus | ForEach-Object { $_.Status.ToString() }) -join ', '
                throw "Custom signer chain validation failed: $chainStatus"
              }
            }
            finally {
              $chain.Dispose()
            }

            $timestampChain = [System.Security.Cryptography.X509Certificates.X509Chain]::new()
            try {
              $timestampChain.ChainPolicy.RevocationMode = [System.Security.Cryptography.X509Certificates.X509RevocationMode]::NoCheck
              if (-not $timestampChain.Build($signature.TimeStamperCertificate)) {
                $timestampStatus = ($timestampChain.ChainStatus | ForEach-Object { $_.Status.ToString() }) -join ', '
                throw "Timestamp certificate chain validation failed: $timestampStatus"
              }
            }
            finally {
              $timestampChain.Dispose()
            }

            Write-Host "Self-signed Authenticode signer and public timestamp chain validated."
          }
          else {
            throw "Authenticode verification failed with status $($signature.Status): $($signature.StatusMessage)"
          }

          # Keep SignTool output as a diagnostic. A private self-signed root is expected to
          # make /pa return non-zero on a hosted runner even after the exact signer and the
          # public timestamp chain were validated above.
          & $env:SIGNTOOL_PATH verify /pa /v $exe
          $signToolVerifyExit = $LASTEXITCODE
          if ($signToolVerifyExit -ne 0 -and -not $expectedPrivateRoot) {
            throw "SignTool verification failed with exit code $signToolVerifyExit."
          }
          if ($signToolVerifyExit -ne 0 -and $expectedPrivateRoot) {
            Write-Warning "SignTool reported the expected untrusted private root on the hosted runner; custom-chain verification already succeeded."
            $global:LASTEXITCODE = 0
          }

      - name: Publish public trust certificate with artifact
        shell: pwsh
        run: |
          Copy-Item $env:SIGNING_CER_PATH "dist/RessourcePlanner-Internal-CodeSigning.cer" -Force

      - name: Generate SHA256 checksum after signing
        shell: pwsh
        run: |
          $exe = "dist/$($env:APP_NAME).exe"
          $sha = "$exe.sha256"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($env:APP_NAME).exe" | Set-Content -Encoding ascii $sha

      - name: Upload signed artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}
          path: |
            dist/${{ env.APP_NAME }}.exe
            dist/${{ env.APP_NAME }}.exe.sha256
            dist/RessourcePlanner-Internal-CodeSigning.cer
          if-no-files-found: error

      - name: Publish signed GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $exe = "dist/$($env:APP_NAME).exe"
          $sha = "$exe.sha256"
          $cer = "dist/RessourcePlanner-Internal-CodeSigning.cer"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe $sha $cer --clobber
          }
          else {
            gh release create $tag $exe $sha $cer `
              --target "${{ github.sha }}" `
              --title "RessourcePlanner V$($env:APP_VERSION)" `
              --generate-notes `
              --latest
          }

      - name: Cleanup signing material
        if: always()
        shell: pwsh
        run: |
          if ($env:SIGNING_CERT_THUMBPRINT) {
            $path = "Cert:\CurrentUser\My\$($env:SIGNING_CERT_THUMBPRINT)"
            if (Test-Path $path) {
              Remove-Item $path -Force -ErrorAction SilentlyContinue
            }
          }
          if ($env:SIGNING_PFX_PATH -and (Test-Path $env:SIGNING_PFX_PATH)) {
            Remove-Item $env:SIGNING_PFX_PATH -Force -ErrorAction SilentlyContinue
          }

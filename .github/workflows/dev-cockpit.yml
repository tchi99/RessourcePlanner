name: Dev Cockpit

on:
  pull_request:
    paths:
      - "dev-cockpit/**"
      - "docker-compose.yml"
      - ".env.example"
      - ".gitignore"
      - "README.md"
      - "docs/DEPLOYMENT_UBUNTU_VM.md"
      - ".github/workflows/dev-cockpit.yml"

concurrency:
  group: dev-cockpit-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RESOURCEPLANNER_HTTP_PORT: "18080"
      DEV_COCKPIT_HTTP_PORT: "18081"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: dev-cockpit/backend/requirements.txt

      - name: Install cockpit backend dependencies
        run: python -m pip install -r dev-cockpit/backend/requirements.txt

      - name: Compile cockpit backend
        run: python -m compileall -q dev-cockpit/backend

      - name: Test cockpit backend
        working-directory: dev-cockpit/backend
        run: python -m unittest discover -s tests -v

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install and build cockpit frontend
        working-directory: dev-cockpit/frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Validate Compose profile isolation
        run: |
          docker compose config >/tmp/resourceplanner-compose.yml
          docker compose --profile dev-tools config >/tmp/resourceplanner-dev-tools-compose.yml
          docker compose config --services >/tmp/resourceplanner-services.txt
          docker compose --profile dev-tools config --services >/tmp/resourceplanner-dev-tools-services.txt
          ! grep -qx 'dev-cockpit' /tmp/resourceplanner-services.txt
          grep -qx 'backend' /tmp/resourceplanner-dev-tools-services.txt
          grep -qx 'frontend' /tmp/resourceplanner-dev-tools-services.txt
          grep -qx 'dev-cockpit' /tmp/resourceplanner-dev-tools-services.txt
          grep -q '127.0.0.1:18081' /tmp/resourceplanner-dev-tools-compose.yml

      - name: Smoke RessourcePlanner plus Dev Cockpit
        run: |
          docker compose --profile dev-tools up -d --build
          app_ready=0
          cockpit_ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/ready | grep -q '"status":"ready"'; then
              app_ready=1
            fi
            if curl -fsS http://127.0.0.1:18081/api/health >/tmp/cockpit-health.json; then
              cockpit_ready=1
            fi
            if [ "$app_ready" = "1" ] && [ "$cockpit_ready" = "1" ]; then
              break
            fi
            sleep 2
          done
          test "$app_ready" = "1"
          test "$cockpit_ready" = "1"
          grep -q '"token_configured":false' /tmp/cockpit-health.json
          curl -fsS http://127.0.0.1:18080/health | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:18080/ | grep -qi '<html'
          curl -fsS http://127.0.0.1:18081/api/config | grep -q 'tchi99/RessourcePlanner'
          curl -fsS http://127.0.0.1:18081/ | grep -qi '<html'
          status="$(curl -sS -o /tmp/cockpit-dashboard.json -w '%{http_code}' http://127.0.0.1:18081/api/dashboard)"
          test "$status" = "503"
          grep -q 'DEV_COCKPIT_GITHUB_TOKEN' /tmp/cockpit-dashboard.json

      - name: Show Docker diagnostics on failure
        if: failure()
        run: |
          docker compose --profile dev-tools ps -a
          docker compose --profile dev-tools logs --no-color --tail=250

      - name: Stop cockpit smoke
        if: always()
        run: docker compose --profile dev-tools down --remove-orphans

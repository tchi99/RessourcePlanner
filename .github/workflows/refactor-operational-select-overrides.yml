name: One-off operational select override refactor

on:
  push:
    branches:
      - refactor/operational-select-overrides
    paths:
      - tools/refactor_operational_select_overrides.py
      - .github/workflows/refactor-operational-select-overrides.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/operational-select-overrides
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply refactor
        run: python tools/refactor_operational_select_overrides.py
      - name: Compile transformed sources
        run: python -m compileall -q app tests tools
      - name: Commit transformed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/v16_refinements.py app/v17_refinements.py tests/test_nicegui_global_mutations.py
          git commit -m "Replace operational select assignments with scoped overrides"
          git push
